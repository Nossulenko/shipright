# ShipRight — deploy to Google Cloud Run on every push to main.
#
# Copy to .github/workflows/deploy-gcp.yml. No secrets needed: authentication uses
# Workload Identity Federation (short-lived OIDC tokens). Set these GitHub repository
# VARIABLES (Settings → Secrets and variables → Actions → Variables), or run the
# `gh variable set` commands printed by setup-wif.sh:
#
#   GCP_PROJECT_ID     e.g. my-product-prod
#   GCP_REGION         e.g. europe-west1
#   GCP_WIF_PROVIDER   projects/<NUMBER>/locations/global/workloadIdentityPools/github/providers/<PROVIDER>
#   GCP_DEPLOYER_SA    <service>-deployer@<project>.iam.gserviceaccount.com
#   GCP_RUNTIME_SA     <service>-runtime@<project>.iam.gserviceaccount.com
#   GCP_AR_REPO        Artifact Registry repository name
#   CLOUD_RUN_SERVICE  Cloud Run service name
#   APP_DIR            e.g. apps/web
#   HEALTH_PATH        e.g. /health or /api/health

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; never cancel one half-way.
concurrency:
  group: deploy-gcp
  cancel-in-progress: false

# Least privilege: read the code, mint an OIDC token. Nothing else.
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A GitHub "environment" lets you add required reviewers before a deploy runs.
    environment: production
    timeout-minutes: 20
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.CLOUD_RUN_SERVICE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Let Docker push to Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push the image (tagged with the commit SHA)
        run: |
          docker build -t "$IMAGE" "${{ vars.APP_DIR }}"
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --service-account=${{ vars.GCP_RUNTIME_SA }}

      - name: Smoke check the health endpoint
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}${{ vars.HEALTH_PATH }}"
